services:
  intel-gpu-exporter:
    build: .
    container_name: intel-gpu-exporter
    privileged: true
    devices:
      - /dev/dri:/dev/dri
      - /dev/dri/card0:/dev/dri/card0
      - /dev/dri/renderD128:/dev/dri/renderD128
    group_add:
      - "993"
      - "44"
    ports:
      - "9981:9981"
    restart: unless-stopped
