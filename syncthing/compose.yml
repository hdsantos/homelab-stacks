services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    environment:
      - PUID=1000 # Ajusta para o teu UID do utilizador na VM 101 se necessário
      - PGID=1000 # Ajusta para o teu GID do utilizador na VM 101
      - TZ=Europe/Lisbon
    volumes:
      - /mnt/zfs_data/docker_volumes/syncthing/config:/config
      - /mnt/truenas_pessoal:/data/pessoal # <--- Montagem NFS mapeada para o container
    ports:
      - 8384:8384
      - 22000:22000/tcp
      - 22000:22000/udp
      - 21027:21027/udp
    restart: unless-stopped
